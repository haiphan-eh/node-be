openapi: 3.0.0
info:
  title: Ecommerce API
  version: 1.0.0
  description: Complete API documentation for ecommerce platform
  contact:
    name: API Support
    email: support@ecommerce.com

servers:
  - url: http://localhost:3055
    description: Development server
  - url: https://ecommerce-be-0yom.onrender.com
    description: Production server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key for accessing the API
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token for authenticated endpoints

  schemas:
    Error:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          example: error
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        stack:
          type: string
          nullable: true
          description: Stack trace (only in development)

security:
  - ApiKeyAuth: []

tags:
  - name: Auth
    description: Authentication endpoints for shop management
  - name: Product
    description: Product management and browsing endpoints
  - name: Cart
    description: Shopping cart management endpoints
  - name: Discount
    description: Discount code management and validation
  - name: Checkout
    description: Order checkout and review endpoints
  - name: Inventory
    description: Inventory management endpoints

paths:
  /:
    get:
      tags:
        - Health
      summary: Health Check
      description: Check if the API is running
      security: []
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: hello world
