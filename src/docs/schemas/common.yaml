components:
  parameters:
    ApiKeyHeader:
      name: x-api-key
      in: header
      required: true
      description: API Key for accessing the API
      schema:
        type: string
        example: "your-api-key-here"

    ClientIdHeader:
      name: x-client-id
      in: header
      required: false
      description: Client/Shop ID
      schema:
        type: string

    AuthorizationHeader:
      name: authorization
      in: header
      required: false
      description: Bearer token (JWT)
      schema:
        type: string
        example: "your-access-token"

    RefreshTokenHeader:
      name: x-refresh-token
      in: header
      required: false
      description: Refresh token for token renewal
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        stack:
          type: string
          nullable: true

    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        metadata:
          type: object

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
