paths:
  /v1/api/checkout:
    post:
      tags:
        - Checkout
      summary: Review Checkout
      description: Review order before final checkout, including discount and inventory checks
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cartId
              properties:
                cartId:
                  type: string
                discount_code:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Checkout review successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  metadata:
                    type: object
                    properties:
                      orderTotal:
                        type: number
                      discountAmount:
                        type: number
                      products:
                        type: array
        "400":
          description: Insufficient inventory or invalid discount
        "401":
          description: Unauthorized
