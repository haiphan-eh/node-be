paths:
  /v1/api/inventory:
    post:
      tags:
        - Inventory
      summary: Insert Inventory
      description: Add inventory stock for a product (requires authentication)
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - stock
              properties:
                productId:
                  type: string
                stock:
                  type: integer
                  minimum: 0
                warehouse:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Inventory inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
