paths:
  /v1/api/shop/signup:
    post:
      tags:
        - Auth
      summary: Shop Sign Up
      description: Create a new shop account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shop_name
                - shop_email
                - shop_password
              properties:
                shop_name:
                  type: string
                  example: My Shop
                shop_email:
                  type: string
                  format: email
                  example: shop@example.com
                shop_password:
                  type: string
                  format: password
                  example: SecurePassword123
      responses:
        "201":
          description: Shop created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Shop created successfully
                  metadata:
                    type: object
                    properties:
                      shop:
                        type: object
                      tokens:
                        type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/api/shop/login:
    post:
      tags:
        - Auth
      summary: Shop Login
      description: Authenticate shop and get access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shop_email
                - shop_password
              properties:
                shop_email:
                  type: string
                  format: email
                shop_password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  metadata:
                    type: object
        "401":
          description: Unauthorized

  /v1/api/shop/logout:
    post:
      tags:
        - Auth
      summary: Shop Logout
      description: Logout shop account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout successful
        "401":
          description: Unauthorized

  /v1/api/shop/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh Token
      description: Refresh access token using refresh token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
        "401":
          description: Unauthorized
