paths:
  /v1/api/shop/signup:
    post:
      tags:
        - Auth
      summary: Shop Sign Up
      description: Create a new shop account
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: My Shop
                email:
                  type: string
                  format: email
                  example: shop@example.com
                password:
                  type: string
                  format: password
                  example: SecurePassword123
      responses:
        "201":
          description: Shop created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Shop created successfully
                  metadata:
                    type: object
                    properties:
                      shop:
                        type: object
                      tokens:
                        type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/api/shop/login:
    post:
      tags:
        - Auth
      summary: Shop Login
      description: Authenticate shop and get access token
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: shop@example.com
                password:
                  type: string
                  format: password
                  example: SecurePassword123
                refreshToken:
                  type: string
                  nullable: true
                  description: Optional refresh token for token rotation
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  metadata:
                    type: object
        "401":
          description: Unauthorized

  /v1/api/shop/logout:
    post:
      tags:
        - Auth
      summary: Shop Logout
      description: Logout shop account
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        "200":
          description: Logout successful
        "401":
          description: Unauthorized

  /v1/api/shop/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh Token
      description: Refresh access token using refresh token
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/RefreshTokenHeader'
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
        "401":
          description: Unauthorized
