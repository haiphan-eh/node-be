paths:
  /v1/api/cart:
    get:
      tags:
        - Cart
      summary: Get User Cart
      description: Retrieve the user's shopping cart (requires authentication)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  metadata:
                    type: object
        "401":
          description: Unauthorized

    post:
      tags:
        - Cart
      summary: Add Product to Cart
      description: Add a product to the shopping cart (requires authentication)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  default: 1
      responses:
        "201":
          description: Product added to cart
        "400":
          description: Bad Request
        "401":
          description: Unauthorized

    put:
      tags:
        - Cart
      summary: Update Product Quantity
      description: Update the quantity of a product in cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      responses:
        "200":
          description: Quantity updated
        "401":
          description: Unauthorized

    delete:
      tags:
        - Cart
      summary: Remove Product from Cart
      description: Delete a product from the shopping cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
              properties:
                productId:
                  type: string
      responses:
        "200":
          description: Product removed from cart
        "401":
          description: Unauthorized
