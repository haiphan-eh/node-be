paths:
  /v1/api/discount/list-product-code:
    get:
      tags:
        - Discount
      summary: Get Available Discount Codes
      description: Retrieve all available discount codes with associated products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 60
      responses:
        "200":
          description: Discount codes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  metadata:
                    type: object

  /v1/api/discount/amount:
    post:
      tags:
        - Discount
      summary: Calculate Discount Amount
      description: Calculate the discount amount for a given code and products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - products
              properties:
                code:
                  type: string
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
      responses:
        "200":
          description: Discount amount calculated
        "400":
          description: Invalid discount code

  /v1/api/discount:
    get:
      tags:
        - Discount
      summary: Get Shop Discount Codes
      description: Retrieve all discount codes created by the shop (requires authentication)
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 60
      responses:
        "200":
          description: Discount codes retrieved
        "401":
          description: Unauthorized

    post:
      tags:
        - Discount
      summary: Create Discount Code
      description: Create a new discount code (requires authentication)
      parameters:
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - discount_type
                - discount_value
                - discount_max_use
              properties:
                code:
                  type: string
                  example: SUMMER20
                discount_description:
                  type: string
                discount_type:
                  type: string
                  enum: [fixed_amount, percentage]
                discount_value:
                  type: number
                discount_max_use:
                  type: integer
                discount_max_use_per_user:
                  type: integer
                  default: 1
                discount_start_date:
                  type: string
                  format: date-time
                discount_end_date:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Discount code created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
